[phases.setup]
pkgs = ["python-3.10", "nodejs-18"]

[build]
install = [
    "cd backend && pip install -r requirements.txt",
    "cd frontend && npm install"
]
build = "cd frontend && npm run build"

[start]
cmd = "cd backend && PYTHON_EXECUTABLE=$(which python3) && $PYTHON_EXECUTABLE -m gunicorn --access-logfile - --error-logfile - backend.main:app --bind 0.0.0.0:$PORT --timeout 600"
